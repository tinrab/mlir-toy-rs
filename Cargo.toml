[workspace]
resolver = "3"

members = ["melior-ext", "toy", "xtask"]
default-members = ["melior-ext", "toy"]

[workspace.package]
edition = "2024"
version = "0.0.0"

[workspace.dependencies]
melior-ext = { path = "melior-ext" }

anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive"] }
melior = { version = "0.28.2", features = ["ods-dialects"] }
mlir-sys = "230.0.2"
thiserror = "2.0.21"

[workspace.metadata.no-slop.rules]
require-mod-rs-layout = "off"
