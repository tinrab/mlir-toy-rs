[package]
name = "xtask"
description = "Development tasks for this workspace, such as `cargo xtask no-slop`"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "^1.0.104"
cargo_metadata = "^0.23.1"
globset = "^0.4.20"
proc-macro2 = { version = "^1.0.107", features = ["span-locations"] }
ra-ap-rustc_lexer = "^0.125.0"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
similar = { version = "^3.2", default-features = false, features = ["text"] }
syn = { version = "^3.0.9", features = ["full", "visit"] }
walkdir = "^2.5.0"
